---
# Converge the GitHub Actions self-hosted runner fleet.
#
# Safe to re-run at any time and with no registration tokens: the role only
# needs a token for a runner that is not yet registered. Runners are drained and
# reconfigured one at a time, so a run during CI does not kill in-flight jobs.
#
#   ansible-playbook -i ansible/inventory.ini ansible/playbooks/runners.yml
#   GH_RUNNER_TOKENS=tok1,tok2 ansible-playbook ... -e '@vars.json'

- name: Provision GitHub Actions runners
  hosts: gh_runner
  gather_facts: false
  become: true
  any_errors_fatal: true

  pre_tasks:
    - name: Wait for the container to accept SSH
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Gather facts
      ansible.builtin.setup:

  roles:
    - role: github_runner
      github_runner_tokens_raw: "{{ lookup('env', 'GH_RUNNER_TOKENS') | default('', true) }}"
      github_pat: "{{ lookup('env', 'GH_RUNNER_PAT') | default('', true) }}"

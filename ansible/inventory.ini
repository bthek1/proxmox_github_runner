# Static homelab inventory. The runner's last IP octet matches its Proxmox VMID
# (VMID 111 -> 192.168.2.111); `terraform apply` overrides ansible_host anyway.
[gh_runner]
gh-runner ansible_host=192.168.2.111 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_ed25519

[proxmox]
proxmox-bthek1 ansible_host=192.168.2.70 ansible_user=ben
